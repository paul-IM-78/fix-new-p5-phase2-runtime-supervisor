<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Staking Wallet password</title>
  </head>
  <body>
    <main>
      <h1>Reset your password</h1>

      </p>
    </main>
  </body>
</html>
